    <path d="M1704 268h116v330l-58 26-58-26Z" fill="url(#banner)" stroke="#2d2115" stroke-width="2"/>
    <path d="M1704 286h116M1704 560h116" stroke="#c9a35f" stroke-opacity="0.22" stroke-width="2"/>
    <g transform="translate(1732 366) scale(2.3)" fill="none" stroke="#d8b573" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round">
      <path d="M1 16C-11 13-18 3-15-7c3-10 13-15 22-11 6 3 9 9 7 15-1 5-6 8-11 6-4-1-5-5-3-8 1-2 4-3 6-1"/>
      <path d="M17 3c5 9 3 18-4 24"/>
    </g>
  </g>

  <!-- floor -->
  <rect x="0" y="852" width="1920" height="348" fill="url(#floor)"/>
  <g stroke="#241810" stroke-opacity="0.55" stroke-width="2">
    <path d="M0 884h1920M0 938h1920M0 1000h1920M0 1074h1920M0 1160h1920"/>
    <path d="M180 852l-80 348M480 852l-30 348M780 852l30 348M1080 852l90 348M1400 852l140 348M1740 852l190 348"/>
