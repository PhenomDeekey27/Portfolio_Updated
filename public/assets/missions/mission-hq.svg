  </g>

  <!-- low wooden briefing table -->
  <path d="M588 900 1540 842 1890 1028 890 1132Z" fill="url(#tableTop)"/>
  <path d="M588 900 1540 842 1890 1028 890 1132Z" fill="url(#warmTable)"/>
  <path d="M890 1132 1890 1028v58L890 1198Z" fill="url(#tableEdge)"/>
  <path d="M588 900 1540 842 1890 1028" fill="none" stroke="#5a3b22" stroke-opacity="0.55" stroke-width="3"/>
  <path d="M890 1132 1890 1028" fill="none" stroke="#4a301b" stroke-opacity="0.6" stroke-width="2"/>
  <g stroke="#1a1009" stroke-opacity="0.55" stroke-width="1.5" fill="none">
