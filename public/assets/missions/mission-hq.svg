<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A traditional Hidden Leaf mission briefing room at night: a low wooden table with a Land of Fire map, scrolls and sealed documents, shoji screens opening onto a misty forest, and a warm paper lantern">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#0a0c09"/>
      <stop offset="0.5" stop-color="#080a07"/>
      <stop offset="1" stop-color="#050605"/>
    </linearGradient>
    <linearGradient id="plaster" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#0b0d0a"/>
      <stop offset="0.65" stop-color="#0d100c"/>
      <stop offset="1" stop-color="#090b08"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1c12"/>
      <stop offset="0.5" stop-color="#1a110b"/>
      <stop offset="1" stop-color="#0f0a07"/>
    </linearGradient>
    <linearGradient id="beamSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0906"/>
      <stop offset="0.55" stop-color="#24170f"/>
      <stop offset="1" stop-color="#130d08"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16100a"/>
      <stop offset="0.55" stop-color="#100b07"/>
      <stop offset="1" stop-color="#080604"/>
    </linearGradient>
    <linearGradient id="tableTop" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#3b2718"/>
      <stop offset="0.45" stop-color="#291b11"/>
      <stop offset="1" stop-color="#160e08"/>
    </linearGradient>
    <linearGradient id="tableEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c120b"/>
      <stop offset="1" stop-color="#0a0705"/>
    </linearGradient>
    <linearGradient id="forestSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07110e"/>
      <stop offset="0.5" stop-color="#0b1a15"/>
      <stop offset="0.78" stop-color="#12251c"/>
      <stop offset="1" stop-color="#0c1712"/>
    </linearGradient>
    <linearGradient id="forestHaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c927f" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#7c927f" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#7c927f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d3bb8c"/>
      <stop offset="0.55" stop-color="#b39a6e"/>
      <stop offset="1" stop-color="#8a7350"/>
    </linearGradient>
    <linearGradient id="paperShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0c99a"/>
      <stop offset="0.7" stop-color="#b9a073"/>
      <stop offset="1" stop-color="#8e7752"/>
    </linearGradient>
    <linearGradient id="shojiPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7b183" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#9e8a63" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6c5c41" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="lanternPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d7a0"/>
      <stop offset="0.45" stop-color="#eabf79"/>
      <stop offset="1" stop-color="#c28c48"/>
