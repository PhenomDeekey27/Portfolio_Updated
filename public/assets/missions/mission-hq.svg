    <path d="M980 900c40 70 60 140 44 216M1280 878c20 78 24 152 6 226M1600 866c-6 74-20 142-46 208"/>
  </g>
  <g transform="translate(1790 1092) rotate(-6)" fill="none" stroke="#c9a35f" stroke-opacity="0.3" stroke-width="1.4" stroke-linecap="round">
