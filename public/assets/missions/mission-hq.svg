      <path d="M1052 802V486c0-10 6-18 14-18s14 8 14 18v316Z"/>
      <path d="M1066 506c-62 6-108 24-146 44 46 8 104 8 146-2 42 10 100 10 146 2-38-20-84-38-146-44Z"/>
      <path d="M1066 570c-70 6-120 24-162 44 50 8 116 8 162-2 46 10 112 10 162 2-42-20-92-38-162-44Z"/>
      <path d="M1066 638c-78 6-132 24-178 44 56 8 128 8 178-2 50 10 122 10 178 2-46-20-100-38-178-44Z"/>
      <path d="M1066 710c-86 6-146 24-196 44 60 8 140 8 196-2 56 10 136 10 196 2-50-20-110-38-196-44Z"/>
    </g>

    <!-- near cedar silhouette, right edge -->
