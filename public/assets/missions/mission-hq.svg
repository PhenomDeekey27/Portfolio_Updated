  <!-- kunai on the table edge -->
  <g transform="translate(760 1112) rotate(-18)">
    <path d="M-46 0 16-7l14 7-14 7-62-7Z" fill="url(#kunaiMetal)"/>
    <path d="M-46 0 16-7l14 7" fill="none" stroke="#a5a39a" stroke-opacity="0.35"/>
