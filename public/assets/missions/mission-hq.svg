    <radialGradient id="lanternGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6ce8d" stop-opacity="0.5"/>
      <stop offset="0.35" stop-color="#e2a95e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c98a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lightPool" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#eab878" stop-opacity="0.2"/>
      <stop offset="0.42" stop-color="#c98f4c" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#a16b31" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lightBeam" cx="0.5" cy="0.25" r="0.62">
      <stop offset="0" stop-color="#f0c184" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#d59a54" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#b87c36" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2b21"/>
      <stop offset="0.5" stop-color="#122019"/>
      <stop offset="1" stop-color="#0b1510"/>
    </linearGradient>
    <radialGradient id="warmTable" cx="0.58" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#d59e57" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#a16b31" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#a16b31" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sealRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e2f27"/>
      <stop offset="1" stop-color="#5f1d18"/>
    </linearGradient>
    <linearGradient id="kunaiMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d8c84"/>
      <stop offset="0.5" stop-color="#4d4d47"/>
      <stop offset="1" stop-color="#262623"/>
    </linearGradient>
  </defs>

  <!-- room shell -->
  <rect width="1920" height="1200" fill="url(#room)"/>

  <!-- interior plaster wall -->
  <rect x="0" y="80" width="980" height="790" fill="url(#plaster)"/>
  <g opacity="0.5">
