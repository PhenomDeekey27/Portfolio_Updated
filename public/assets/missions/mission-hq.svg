    </g>
    <path d="M436 84c10-4 18 2 18 12s-8 16-18 12" fill="none" stroke="#7b5f3c" stroke-opacity="0.5" stroke-width="2"/>
    <g transform="translate(468 150) rotate(-4)" fill="none" stroke="#c9a35f" stroke-opacity="0.4" stroke-width="1.2" stroke-linecap="round">
      <path d="M0 8C-6 6-9 1-8-4c2-5 7-7 11-5 3 1 4 4 3 6-1 2-3 3-5 2"/>
      <path d="M7 2c3 4 2 8-2 11"/>
    </g>
  </g>

  <!-- rolled scrolls -->
  <g>
    <path d="M690 1028l168-22c10-1 18 6 18 16s-7 18-17 19l-168 20c-10 1-18-6-18-16s7-17 17-17Z" fill="url(#paperShade)" stroke="#7a6443" stroke-width="1.2"/>
