  <!-- lantern -->
  <g>
    <path d="M1458 86v104" stroke="#1b120b" stroke-width="5"/>
    <rect x="1418" y="188" width="80" height="18" fill="#2a1c11" stroke="#0d0906" stroke-width="2"/>
    <path d="M1430 206h56l18 118h-92Z" fill="url(#lanternPaper)" stroke="#3a2717" stroke-width="2"/>
    <path d="M1438 224h40M1435 248h46M1432 272h52M1429 296h58" stroke="#8a5f2e" stroke-opacity="0.4" stroke-width="1.5"/>
