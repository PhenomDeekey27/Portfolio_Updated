    <path d="M60 80v790M210 80v790M470 80v790M820 80v790M930 80v790" stroke="#141a13" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- far shoji panels on the left wall (very dim, behind text) -->
  <g opacity="0.32">
    <rect x="80" y="310" width="330" height="420" fill="url(#shojiPaper)" stroke="#1a140d" stroke-width="4"/>
    <path d="M80 415h330M80 520h330M80 625h330M162 310v420M244 310v420M326 310v420" stroke="#1a140d" stroke-width="3"/>
