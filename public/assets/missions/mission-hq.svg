    <path d="M0 26 466-18 560 158 96 212Z" fill="#0b0d09" opacity="0.06"/>
    <path d="M14 40c86-18 140-2 206 6s132-8 196-28 104-20 128-8" fill="none" stroke="#6b5a3d" stroke-opacity="0.5" stroke-width="2.5"/>
