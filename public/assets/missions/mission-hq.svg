  <!-- veranda opening: night forest -->
  <g>
    <rect x="980" y="94" width="940" height="758" fill="url(#forestSky)"/>

    <!-- distant moon haze -->
    <rect x="980" y="94" width="940" height="360" fill="url(#forestHaze)" opacity="0.5"/>

    <!-- far mountains -->
    <path d="M980 596l90-52 74 34 86-46 92 40 84-58 96 42 78-30 92 48 94-58 84 36 70-22v126H980Z" fill="#0b1712" opacity="0.9"/>
    <path d="M980 640l104-34 88 22 96-30 100 26 88-40 100 28 96-20 94 32 94-38 80 24v104H980Z" fill="#0d1d16" opacity="0.95"/>

    <!-- distant village rooftops and warm windows -->
    <g fill="#08120e" opacity="0.98">
      <path d="M1120 714l58-34 58 34v42h-116z"/>
      <path d="M1250 722l52-30 52 30v36h-104z"/>
      <path d="M1380 706l64-38 64 38v48h-128z"/>
      <path d="M1530 724l46-28 46 28v34h-92z"/>
