  <g>
    <path d="M1370 1002l152-24c9-1 16 5 17 14s-6 17-15 18l-152 22c-9 1-16-5-17-14s6-15 15-16Z" fill="url(#paperShade)" stroke="#7a6443" stroke-width="1.2"/>
    <ellipse cx="1534" cy="1000" rx="11" ry="17" fill="#b49b70" stroke="#7a6443"/>
    <path d="M1444 1002l2 30M1428 1004l2 30" stroke="#3b2c1b" stroke-width="3"/>
    <path d="M1430 1019l16-2" stroke="#8e2f27" stroke-width="4"/>
  </g>

  <!-- sealed documents -->
  <g transform="translate(1620 1084) rotate(-8)">
    <rect x="-84" y="-42" width="176" height="116" rx="2" fill="url(#paperShade)" stroke="#6f5a3b"/>
    <rect x="-76" y="-50" width="170" height="108" rx="2" fill="url(#paper)" stroke="#6f5a3b"/>
