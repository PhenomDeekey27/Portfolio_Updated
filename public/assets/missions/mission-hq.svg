    <g fill="#e8b46b" opacity="0.5">
      <rect x="1146" y="722" width="5" height="7"/>
      <rect x="1170" y="730" width="4" height="5"/>
      <rect x="1300" y="732" width="5" height="6"/>
      <rect x="1410" y="720" width="5" height="7"/>
      <rect x="1436" y="734" width="4" height="5"/>
    </g>

    <!-- mist bands -->
    <rect x="980" y="556" width="940" height="92" fill="url(#forestHaze)"/>
    <rect x="980" y="672" width="940" height="120" fill="url(#forestHaze)" opacity="0.8"/>

    <!-- distant cedar band -->
    <g fill="#0a1711" opacity="0.8">
      <path d="M990 760V452c0-8 5-14 12-14s12 6 12 14v308Z"/>
      <path d="M1014 470c-44 4-76 16-104 30 34 6 74 6 104 0 30 6 70 6 104 0-28-14-60-26-104-30Z"/>
      <path d="M1014 522c-50 4-86 16-118 30 38 6 84 6 118 0 34 6 80 6 118 0-32-14-68-26-118-30Z"/>
      <path d="M1580 760V480c0-9 5-16 13-16s13 7 13 16v280Z"/>
      <path d="M1593 498c-42 4-72 16-98 30 32 6 70 6 98 0 28 6 66 6 98 0-26-14-56-26-98-30Z"/>
      <path d="M1593 548c-48 4-82 16-112 30 36 6 80 6 112 0 32 6 76 6 112 0-30-14-64-26-112-30Z"/>
    </g>

    <!-- near cedar silhouettes -->
