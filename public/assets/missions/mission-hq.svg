      <path d="M1668 596c-90 6-154 26-206 48 64 8 148 8 206-2 58 10 142 10 206 2-52-22-116-42-206-48Z"/>
      <path d="M1668 674c-100 6-170 26-226 48 70 8 162 8 226-2 64 10 156 10 226 2-56-22-126-42-226-48Z"/>
    </g>

    <!-- drifting ground mist -->
    <path d="M980 756c150-30 250 18 380 2s260-34 380 0 160 10 180 4v50H980Z" fill="#9db39d" opacity="0.05"/>
  </g>

  <!-- veranda timber frame -->
  <rect x="940" y="86" width="52" height="780" fill="url(#beamSide)"/>
  <rect x="940" y="86" width="8" height="780" fill="#4a311d" opacity="0.28"/>
  <rect x="980" y="116" width="940" height="34" fill="url(#beam)"/>
  <rect x="980" y="116" width="940" height="5" fill="#4a311d" opacity="0.35"/>
  <rect x="1860" y="86" width="60" height="780" fill="url(#beamSide)"/>
  <path d="M980 150h940" stroke="#050604" stroke-width="4" opacity="0.7"/>

  <!-- ranma transom: vertical slats above the veranda opening -->
  <g opacity="0.85">
    <rect x="990" y="152" width="870" height="86" fill="#080a07" opacity="0.55"/>
    <g stroke="#1e150d" stroke-width="5">
      <path d="M1010 152v86M1046 152v86M1082 152v86M1118 152v86M1154 152v86M1190 152v86M1226 152v86M1262 152v86M1298 152v86M1334 152v86M1370 152v86M1406 152v86M1442 152v86M1478 152v86M1514 152v86M1550 152v86M1586 152v86M1622 152v86M1658 152v86M1694 152v86M1730 152v86M1766 152v86M1802 152v86M1838 152v86"/>
    </g>
    <path d="M990 238h870" stroke="#1e150d" stroke-width="7"/>
  </g>

  <!-- engawa railing at the veranda edge -->
  <g>
    <rect x="990" y="792" width="870" height="13" fill="#2b1c12"/>
    <rect x="990" y="792" width="870" height="4" fill="#4a311d" opacity="0.35"/>
    <g stroke="#24170f" stroke-width="7">
      <path d="M1020 805v34M1110 805v34M1200 805v34M1290 805v34M1380 805v34M1470 805v34M1560 805v34M1650 805v34M1740 805v34M1830 805v34"/>
    </g>
    <rect x="990" y="834" width="870" height="11" fill="#1b110b"/>
  </g>

  <!-- carved leaf plaque on the left pillar -->
  <g>
    <rect x="946" y="300" width="40" height="128" fill="#1d130c" stroke="#3a2617" stroke-width="2"/>
